/* Layout: cabecera tipo marcador + pestañas; contenido en tarjetas y tablas densas. */
:root{
  --bg:#EDEFF3; --panel:#FFFFFF; --soft:#F3F5F9; --ink:#101827; --muted:#5B6577; --line:#D8DCE4;
  --accent:#D9480F; --accent-ink:#FFFFFF; --good:#12805C; --bad:#C2301E; --warn:#9A5B00; --hl:#FFEFE4;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --panel:#131C2E; --soft:#0F1727; --ink:#E8ECF4; --muted:#9AA6BD; --line:#25324A;
  --accent:#FF8A4C; --accent-ink:#1A0E05; --good:#3DD6A0; --bad:#FF7A6B; --warn:#F2B24C; --hl:#3A2A22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --panel:#131C2E; --soft:#0F1727; --ink:#E8ECF4; --muted:#9AA6BD; --line:#25324A;
  --accent:#FF8A4C; --accent-ink:#1A0E05; --good:#3DD6A0; --bad:#FF7A6B; --warn:#F2B24C; --hl:#3A2A22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:800;letter-spacing:.02em;text-wrap:balance}
h2{font-size:22px;text-transform:uppercase}
h3{font-size:16px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
h4{font-size:13px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--team,var(--accent));border-radius:10px;padding:14px 16px}
.top .id{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 260px}
.top .id h1{font-size:30px;line-height:1;text-transform:uppercase}
.top .sub{color:var(--muted);font-size:13px}
.score{display:flex;gap:22px;align-items:flex-end}
.score div{display:flex;flex-direction:column;align-items:flex-start}
.score b{font-family:var(--display);font-size:34px;line-height:1;font-weight:800}
.score span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tb{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:26px;padding:0 7px;border-radius:5px;background:var(--c);color:var(--t);
  font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em;border:1px solid color-mix(in srgb,var(--ink) 18%,transparent)}
.tb.lg{min-width:52px;height:38px;font-size:21px;border-radius:7px}

.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.full{grid-column:1/-1}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--soft);padding:9px 14px;border-radius:7px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover:not(:disabled){filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{color:var(--bad)}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
tr.me td{background:var(--hl)}
tr.cut td{border-top:2px dashed var(--muted)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.pill{display:inline-block;min-width:22px;text-align:center;padding:1px 6px;border-radius:4px;font-weight:700;font-size:12px;color:#fff}
.pill.w{background:var(--good)} .pill.l{background:var(--bad)}
:root[data-theme="dark"] .pill{color:#0B1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill{color:#0B1220}}
.ovr{font-family:var(--display);font-weight:800;font-size:18px}
.next{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.next .vs{font-family:var(--display);font-size:26px;font-weight:800;text-transform:uppercase;line-height:1.05}
.list{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .grow{flex:1 1 120px;min-width:0}
select{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:8px 10px;max-width:100%}
.note{font-size:12px;color:var(--muted)}
.save{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.err{background:var(--warn)}

.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:8px}
.pick{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
.pick:hover{border-color:var(--accent)}
.pick .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .m{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick > div{min-width:0}
.hero{display:flex;flex-direction:column;gap:6px;max-width:62ch}
.hero h1{font-size:44px;line-height:.95;text-transform:uppercase}

input[type=range]{accent-color:var(--accent);width:100%;min-width:130px}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.chk{display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.chk:last-child{border-bottom:0}
.chk.on{background:var(--hl)}
.chk .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.verdict{border-left:4px solid var(--muted);padding:8px 12px;background:var(--soft);border-radius:0 7px 7px 0}
.verdict.ok{border-color:var(--good)} .verdict.mid{border-color:var(--warn)} .verdict.no{border-color:var(--bad)}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}

.bracket{display:grid;grid-template-columns:repeat(3,minmax(160px,1fr));gap:12px;min-width:520px}
.rc{display:flex;flex-direction:column;gap:8px;justify-content:space-around}
.ser{border:1px solid var(--line);border-radius:7px;padding:6px 8px;display:flex;flex-direction:column;gap:3px;background:var(--soft)}
.ser.me{border-color:var(--accent);background:var(--hl)}
.ser.ph{color:var(--muted);font-size:12px;text-align:center;padding:14px 8px}
.ser .sr{display:flex;align-items:center;gap:8px}
.ser .sr b{margin-left:auto;font-family:var(--display);font-size:20px}
.ser .sr.win b{color:var(--good)}
.ser .sr:not(.win) .tb{opacity:.9}
.ser .sd{font-size:11px}
.ser.done .sr:not(.win){opacity:.55}
@media (max-width:520px){.top .id h1{font-size:24px}.score b{font-size:28px}.hero h1{font-size:36px}}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .15s,filter .15s}}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content;max-width:100%}
.seg button{padding:7px 12px;background:var(--soft);border:0;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
input#mgrName{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--soft);color:var(--ink);font:inherit;max-width:280px}
.live{position:fixed;inset:0;background:rgba(5,10,20,.72);z-index:60;display:flex;align-items:center;justify-content:center;padding:12px}
.lv-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(760px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.lv-top{display:flex;align-items:center;justify-content:center;gap:16px}
.lv-sc{font-family:var(--display);font-size:52px;line-height:1}
.lv-mid{display:flex;justify-content:center;gap:12px;align-items:baseline;font-size:18px}
.lv-bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}.lv-bar i{display:block;height:100%;background:var(--accent)}
.lv-body{display:grid;grid-template-columns:3fr 2fr;gap:14px}
.lv-feed{display:flex;flex-direction:column;gap:5px;min-height:150px;font-size:13px}.lv-feed .q{color:var(--accent);font-weight:700}
.lv-side{display:flex;flex-direction:column;gap:4px;font-size:13px}
.lv-ctl{justify-content:center}
@media (max-width:620px){.lv-body{grid-template-columns:1fr}.lv-sc{font-size:40px}}
.gr{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.gr.on{background:var(--hl)}.gr.sel{border-color:var(--accent)}.gr .gp{width:12px;color:var(--accent)}
.gr .en{width:44px;height:6px;background:var(--soft);border-radius:3px;overflow:hidden;display:inline-block}.gr .en i{display:block;height:100%}
.gr .num{min-width:26px;text-align:right}
</style>

function buildSchedule(seed){
  const rnd=mulberry32(seed),games=[];

    const di=(i/5)|0,dj=(j/5)|0,ci=i<15?0:1,cj=j<15?0:1;
    let n;

    const first=(i+j)%2===0;
    for(let g=0;g<n;g++){const home=(g%2===0)?(first?i:j):(first?j:i);games.push([home,home===i?j:i])}
  }
  const need=new Array(30).fill(0);games.forEach(([h,a])=>{need[h]++;need[a]++});
  let rem=games.map((_,k)=>k);const days=[];
  while(rem.length){
    const cap=4+Math.floor(rnd()*8),busy=new Uint8Array(30),today=[],left=[];
    const keyed=rem.map(gi=>[need[games[gi][0]]+need[games[gi][1]]+rnd()*1.5,gi]).sort((a,b)=>b[0]-a[0]);
    for(const [,gi] of keyed){

      if(today.length<cap&&!busy[h]&&!busy[a]){busy[h]=busy[a]=1;today.push(gi);need[h]--;need[a]--}else left.push(gi);
    }
    days.push(today);rem=left;
  }
  return {games,days};
}

function allocate(total,wts){
  const noisy=wts.map(w=>w*(.7+Math.random()*.6)),sum=noisy.reduce((a,b)=>a+b,0);
  const raw=noisy.map(w=>w/sum*total),fl=raw.map(Math.floor);

  const order=raw.map((r,i)=>[r-fl[i],i]).sort((a,b)=>b[0]-a[0]);
  for(let k=0;k<rem;k++)fl[order[k%order.length][1]]++;

}
function box(L,pts,teamIdx,po,Pf){
  const P=Pf||allocate(pts,L.map(x=>x.m*Math.pow(Math.max(x.p.o-42,1),1.7)));

  let top=["",-1];
  L.forEach((x,k)=>{
    const p=x.p,st=po?(p.ps||(p.ps=[0,0,0,0])):p.s;
    st[0]++;st[1]+=P[k];st[2]+=R[k];st[3]+=A[k];

function advancePO(){

  if(n===8){const nr=[];for(let c=0;c<2;c++){const w=rd.slice(c*4,c*4+4).map(Wn);nr.push(mk(c,w[0],w[1]),mk(c,w[2],w[3]))}po.rounds.push(nr);po.st="r2"}
  else if(n===4){const nr=[];for(let c=0;c<2;c++){const w=rd.slice(c*2,c*2+2).map(Wn);nr.push(mk(c,w[0],w[1]))}po.rounds.push(nr);po.st="cf"}
  else if(n===2){
    const e=Wn(rd[0]),w=Wn(rd[1]),eBetter=pct(S.teams[e.t])>=pct(S.teams[w.t]);
    po.rounds.push([eBetter?ser(-1,e.t,e.sd,w.t,w.sd):ser(-1,w.t,w.sd,e.t,e.sd)]);po.st="finals";

function pval(p){
  let e=p.o;const f=p.a<=21?.6:p.a<=23?.5:p.a<=25?.35:p.a<=27?.15:0;
  e+=Math.max(0,p.t-p.o)*f;if(p.a>30)e-=(p.a-30)*.8;
  return Math.pow(1.22,e-60);
}
function tradeEval(){
  const me=S.teams[S.me],ot=S.teams[tt];
  const give=[...gs].map(i=>me.pl[i]).filter(Boolean),get=[...rs].map(i=>ot.pl[i]).filter(Boolean);
  const gpk=[...gp].map(i=>S.pk[i]).filter(Boolean),rpk=[...rp].map(i=>S.pk[i]).filter(Boolean);
  const rk=S.teams.map((t,i)=>[teamStr(t),i]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
  const pv=k=>{const dy=k[0]-S.season;let e;if(k[1]===2)e=56;else if(dy<=0)e=62+.4*rk.indexOf(k[2]);else e=67.5-.6*dy;return Math.pow(1.22,e-60)};
  const topO=ot.pl.reduce((b,p)=>p.o>b.o?p:b,ot.pl[0]);
  const recv=give.reduce((s,p)=>s+tval(p),0)+gpk.reduce((s,k)=>s+pv(k),0);
  const ask=(get.reduce((s,p)=>s+tval(p)*(p===topO?1.3:1),0)+rpk.reduce((s,k)=>s+pv(k),0))*1.1;
  const nm=cnt(me)-give.length+get.length,no=cnt(ot)-get.length+give.length;
  const okN=give.length+gpk.length>0&&get.length+rpk.length>0&&nm>=12&&nm<=15&&no>=12&&no<=15;
  const out=give.reduce((s,p)=>s+(p.c||0),0),inn=get.reduce((s,p)=>s+(p.c||0),0);
  const chk=(t,o,i,name)=>{const post=payroll(t)-o+i;return (post<=CAP||i<=o*1.25+.1)?null:`${name} quedaría con ${post.toFixed(1)} M, por encima del tope de ${CAP} M, y solo puede recibir hasta el 125% de lo que envía (${(o*1.25+.1).toFixed(1)} M).`};
  const sal=chk(me,out,inn,"Tu equipo")||chk(ot,inn,out,TEAMS[tt][0]);
  return {give,get,gpk,rpk,r:ask>0?recv/ask:0,okN,nm,no,sal,out,inn};
}

  const best=(arr,f)=>arr.reduce((b,x)=>{const v=f(x);return (!b||v>b.v)?{x,v}:b},null);
  const pick=(arr,f)=>{const r=best(arr,f);return r?r.x:null};
  const aw={mvp:nm(L[0]),anba:L.slice(0,10).map(x=>[x.p.n,x.ti])};

  aw.roy=nm(pick(L.filter(x=>x.p.rk),x=>x.p.o*.4+ppgOf(x.p)));

function seasonMvp(){

function progress(p){

  const d=a<=25?base+(p.t-p.o)*.1+gauss()*1.8:base+gauss()*1.5;
  p.o=clamp(Math.round(p.o+d),45,99);
  p.t=a<=26?clamp(Math.max(p.o,Math.round(p.t+gauss()*1.5-.8)),45,99):p.o;
  p.i=0;delete p.m;if(p.rk!==undefined&&p.rk<=S.season)delete p.rk;delete p.ps;p.s=[0,0,0,0];p.dl=p.o-o0;

}

/* ---------- draft ---------- */
function genClass(){
  const used=leagueNames(),out=[];
  for(let r=0;r<72;r++){
    const pt=clamp(Math.round(86-r*.5+gauss()*3),50,90),o=clamp(Math.round(49+(pt-58)*.7+gauss()*2.5),45,74);
    out.push({n:rndName(used),p:POS5[Math.floor(Math.random()*5)],a:pt>=78?(Math.random()<.65?19:20):19+Math.floor(Math.random()*4),o:Math.min(o,pt),t:pt});
  }
  return out.sort((x,y)=>(y.t*.6+y.o*.4)-(x.t*.6+x.o*.4));
}
function startDraft(){
  if(S.dr||!S.po||S.po.st!=="done")return;
  const po=S.po,inPO=new Set(po.rounds[0].flatMap(s=>s.t)),won=new Map();
  po.rounds.forEach(rd=>rd.forEach(s=>{if(s.win>=0){const w=s.t[s.win];won.set(w,(won.get(w)||0)+1)}}));
  const rec=i=>pct(S.teams[i]),dif=i=>S.teams[i].pf-S.teams[i].pa;
  const lot=Array.from({length:30},(_,i)=>i).filter(i=>!inPO.has(i)).sort((a,b)=>rec(a)-rec(b)||dif(a)-dif(b));
  const pl=Array.from(inPO).sort((a,b)=>(won.get(a)||0)-(won.get(b)||0)||rec(a)-rec(b));
  const base=lot.concat(pl),wts=[140,140,140,125,105,90,75,60,45,30,20,15,10,5],pool=lot.map((t,i)=>({t,w:wts[i]||5})),top=[];
  for(let k=0;k<4&&pool.length;k++){
    const tot=pool.reduce((s,x)=>s+x.w,0);let r=Math.random()*tot,j=0;
    while(j<pool.length-1&&r>=pool[j].w){r-=pool[j].w;j++}
    top.push(pool[j].t);pool.splice(j,1);
  }
  const r1=top.concat(base.filter(t=>!top.includes(t)));
  const orig=r1.concat(base),hold=(t,r)=>{const k=S.pk.find(x=>x[0]===S.season&&x[1]===r&&x[2]===t);return k?k[3]:t};
  S.dr={pool:genClass(),orig,order:orig.map((t,k)=>hold(t,k<30?1:2)),pk:0,picks:[],tk:[],top,done:false};
  rollContracts();
}
function draftTake(idx){
  const d=S.dr,team=d.order[d.pk],p=d.pool[idx];
  S.teams[team].pl.push({n:p.n,p:p.p,a:p.a,o:p.o,t:p.t,i:0,s:[0,0,0,0],rk:S.season+1,c:rookieC(d.pk),y:d.pk<30?3:2});
  d.picks.push({k:d.pk,t:team,n:p.n,p:p.p,o:p.o,pt:p.t,og:d.orig?d.orig[d.pk]:team});d.tk.push(idx);d.pk++;
  if(d.pk>=d.order.length)finishDraft();
}
function bestAvail(noise){
  const d=S.dr,tk=new Set(d.tk);let best=-1,bs=-1e9;
  d.pool.forEach((p,i)=>{if(tk.has(i))return;const s=p.t*.6+p.o*.4+(noise?gauss()*2.5:0);if(s>bs){bs=s;best=i}});
  return best;
}
function finishDraft(){
  const d=S.dr,tk=new Set(d.tk);
  d.pool.forEach((p,i)=>{if(!tk.has(i))S.fa.push({n:p.n,p:p.p,a:p.a,o:p.o,t:p.t,i:0,s:[0,0,0,0]})});
  S.teams.forEach((t,i)=>{if(!isHum(i))trimTeam(i)});

}
function draftSim(mode){
  const d=S.dr;if(!d||d.done)return;
  if(mode==="best"&&d.order[d.pk]===S.me)draftTake(bestAvail(false));
  else if(mode==="one"&&!isHum(d.order[d.pk]))draftTake(bestAvail(true));

  queueSave();render();
}

function rngOf(str){let h=2166136261;for(let i=0;i<str.length;i++)h=Math.imul(h^str.charCodeAt(i),16777619);return()=>{h+=0x6D2B79F5;let t=Math.imul(h^h>>>15,1|h);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildTimeline(det){
  const rnd=rngOf(det.k+"|"+det.ph+"-"+det.pa),ev=[];
  const side=(box,sd)=>{
    const wa=box.map(b=>b[4]+.4);
    box.forEach((b,bi)=>{
      let left=b[1];
      while(left>0){
        const r=rnd();let v=left>=3&&r<.24?3:(left>=2&&r<.86?2:1);
        let a=null;
        if(v>=2&&rnd()<.55){let tot=0;wa.forEach((w,k)=>{if(k!==bi)tot+=w});let x=rnd()*tot;for(let k=0;k<box.length;k++){if(k===bi)continue;x-=wa[k];if(x<=0){a=box[k][0];break}}}
        ev.push({t:Math.floor(rnd()*2879)+1,s:sd,n:b[0],v,a});left-=v;
      }
    });
  };
  side(det.hb,0);side(det.ab,1);
  ev.sort((x,y)=>x.t-y.t);
  [720,1440,2160,2880].forEach((q,k)=>ev.push({t:q,q:k+1}));
  ev.sort((x,y)=>x.t-y.t||(x.q?1:0)-(y.q?1:0));
  return ev;
}

function gmMinute(){

    while(left>0){

  else if(a==="cleartrade"){clearSel();tmsg="";render()}

  else if(a==="startdraft")commit(()=>startDraft());
  else if(a==="draftpick"){const i=+d.i;commit(()=>{if(S.dr&&!S.dr.done&&S.dr.order[S.dr.pk]===S.me){draftTake(i);queueSave();render()}})}
  else if(a==="dsim")commit(()=>draftSim(d.m));
  else if(a==="cut"){const n=(S.teams[S.me].pl[+d.i]||{}).n;commit(()=>{const i=S.teams[S.me].pl.findIndex(p=>p.n===n);if(i>=0)cutPlayer(i)})}
  else if(a==="sign"){const n=(S.fa[+d.i]||{}).n;commit(()=>{const i=S.fa.findIndex(p=>p.n===n);if(i>=0)signFA(i)})}
  else if(a==="renew"){const n=(S.teams[S.me].pl[+d.i]||{}).n;commit(()=>{const i=S.teams[S.me].pl.findIndex(p=>p.n===n);if(i>=0)renew(i)})}
  else if(a==="newseason")commit(()=>newSeason());
  else if(a==="as")commit(()=>{if(d.k==="g")asSim();else contestSim(d.k);queueSave();render()});
});
$.addEventListener("input",e=>{
  const r=e.target;if(!r.classList||!r.classList.contains("mrange"))return;
  ensureManual();
  const p=S.teams[S.me].pl[+r.dataset.pi];if(!p)return;
  p.m=+r.value;
  const lab=document.getElementById("mv-"+r.dataset.pi);if(lab)lab.textContent=p.m;
  updMins();queueSave();
});
$.addEventListener("change",e=>{
  const c=e.target;
  if(c.id==="selTeam"){viewTeam=+c.value;render()}
  else if(c.dataset&&c.dataset.asel){const k=c.dataset.asel,v=c.value;commit(()=>{const E=S.as.E=S.as.E||{};(E[S.me]=E[S.me]||{})[k]=v},true)}
  else if(c.id==="selTrade"){tt=+c.value;clearSel();tmsg="";render()}
  else if(c.dataset&&c.dataset.chk){const set={give:gs,get:rs,gpk:gp,rpk:rp}[c.dataset.chk],i=+c.dataset.i;if(c.checked)set.add(i);else set.delete(i);tmsg="";render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&LV&&!GM)closeLive()});

/* ---------- arranque ---------- */
(async()=>{
  try{
    const c=window.claude,db=c&&c.use?await c.use("db"):null,user=c&&c.use?await c.use("user"):null;
    MYID=user?await user.id():null;
    HOLD=(MYID||"x")+":"+Math.random().toString(36).slice(2,8);
    if(db&&MYID){dbDoc=db.doc("data/users/"+MYID+"/partida");LGD=db.doc("league/main");LKD=db.doc("league/lock")}
  }catch(e){}
  let pref="";try{pref=localStorage.getItem("hardwood-mode")||""}catch(e){}
  if(pref==="liga"&&LGD){LG=true;await loadLeague()}
  else{
    await loadSolo();
    if(!S&&LGD&&!pref){
      try{const snap=await LGD.get();if(snap.exists){const st=JSON.parse(snap.data().state);if(Object.values(st.owners||{}).some(x=>x.u===MYID)){LG=true;await loadLeague()}}}catch(e){}
    }
  }
  render();
})();
